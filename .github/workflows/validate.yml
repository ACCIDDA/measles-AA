name: Validate

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Keep validation and deployment ordered for each branch, including manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Python contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -p test_prepare.py -v
      - run: python -m unittest discover -s tests -p test_contract.py -v

  builders:
    name: R builder tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install and verify R test dependencies
        shell: Rscript {0}
        run: |
          packages <- c("testthat", "data.table", "jsonlite", "jsonvalidate")
          install.packages(packages)
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))
      - run: Rscript scripts/build-data/tests/testthat.R
      - name: Test estimates builder through the Python validator
        run: python -m unittest discover -s tests -p test_estimates_builder.py -v

  published-data:
    name: Published data validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-data: ${{ steps.publication.outputs.has-data }}
    steps:
      - uses: actions/checkout@v7
        with:
          # History distinguishes an unused template from deletion of published data.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Check the preparation and export workflow with fictional data
        run: |
          python scripts/prepare.py prepare --input data/examples --output "$RUNNER_TEMP/prepared"
          python scripts/prepare.py validate --input "$RUNNER_TEMP/prepared"
          python scripts/prepare.py export --input "$RUNNER_TEMP/prepared" --output "$RUNNER_TEMP/site"
          python scripts/prepare.py validate-published --input "$RUNNER_TEMP/site/data"
      - name: Validate committed publication files
        id: publication
        shell: bash
        run: |
          # Templates and examples are scaffolding, not a published submission.
          publication_paths=(data ':(exclude)data/templates' ':(exclude)data/examples')
          if [ -L data ] || [ -f data ] || \
             [ -n "$(git ls-files -- "${publication_paths[@]}")" ] || \
             [ -n "$(git log -1 --format=%H -- "${publication_paths[@]}")" ]; then
            python scripts/prepare.py validate-published --input data
            echo "has-data=true" >> "$GITHUB_OUTPUT"
            echo "Published data passed validation; review advisory warnings in the log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has-data=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No published data yet. Commit the four exported files under data/ to validate a submission."
            echo "No published data yet; only the fictional preparation/export example was checked." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-pages:
    name: Build Pages artifact
    needs: [python, builders, published-data]
    if: >-
      needs.published-data.outputs.has-data == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Package validated publication files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages/data"
          cp data/state.csv data/counties.csv data/schools.csv data/meta.json "$RUNNER_TEMP/pages/data/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy validated data
        id: deployment
        uses: actions/deploy-pages@v4
