name: Validate

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -p test_prepare.py -v
      - run: python -m unittest discover -s tests -p test_contract.py -v

  builders:
    name: R builder tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install and verify R test dependencies
        shell: Rscript {0}
        run: |
          packages <- c("testthat", "data.table", "jsonlite")
          install.packages(packages)
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))
      - run: Rscript scripts/build-data/tests/testthat.R
      - name: Test estimates builder through the Python validator
        run: python -m unittest discover -s tests -p test_estimates_builder.py -v

  published-data:
    name: Published data validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # History distinguishes an unused template from deletion of published data.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Check the preparation and export workflow with fictional data
        run: |
          python scripts/prepare.py prepare --input data/examples --output "$RUNNER_TEMP/prepared"
          python scripts/prepare.py validate --input "$RUNNER_TEMP/prepared"
          python scripts/prepare.py export --input "$RUNNER_TEMP/prepared" --output "$RUNNER_TEMP/site"
          python scripts/prepare.py validate-published --input "$RUNNER_TEMP/site/data"
      - name: Validate committed publication files
        shell: bash
        run: |
          # Templates and examples are scaffolding, not a published submission.
          publication_paths=(data ':(exclude)data/templates' ':(exclude)data/examples')
          if [ -L data ] || [ -f data ] || \
             [ -n "$(git ls-files -- "${publication_paths[@]}")" ] || \
             [ -n "$(git log -1 --format=%H -- "${publication_paths[@]}")" ]; then
            python scripts/prepare.py validate-published --input data
            echo "Published data passed validation; review advisory warnings in the log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::No published data yet. Commit the four exported files under data/ to validate a submission."
            echo "No published data yet; only the fictional preparation/export example was checked." >> "$GITHUB_STEP_SUMMARY"
          fi
